services:
  - type: web
    name: aegis-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: AEGIS_ENV
        value: production
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: AEGIS_QUEUE_MAX_SIZE
        value: "1000"
      - key: AEGIS_QUEUE_WORKERS
        value: "2"
